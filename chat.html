<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ЛЕНА AI 😈</title><style>body{font-family:Arial,sans-serif;background:#f5eee7;margin:0}.wrap{max-width:760px;margin:auto;min-height:100vh;background:#fffaf6;display:flex;flex-direction:column}.top{padding:18px;border-bottom:1px solid #eee;display:flex;justify-content:space-between}.msgs{padding:20px;flex:1}.m{padding:13px 16px;border-radius:16px;margin:10px 0;white-space:pre-wrap;line-height:1.45}.u{background:#ead9c9;margin-left:15%}.a{background:#f2f2f2;margin-right:10%}.form{display:flex;gap:8px;padding:15px;border-top:1px solid #eee}.form textarea{flex:1;min-height:55px;padding:12px;border-radius:12px;border:1px solid #ddd}.form button{width:100px;border:0;border-radius:12px;background:#241b17;color:#fff}.small{font-size:12px;color:#777}</style></head><body><div class="wrap"><div class="top"><div><b>ЛЕНА AI 😈</b><div class="small">Твой персональный куратор</div></div><form method="post" action="/logout"><button>Выйти</button></form></div><div id="msgs" class="msgs"></div><div class="form"><textarea id="input" placeholder="Напиши, что у тебя происходит..."></textarea><button onclick="send()">Отправить</button></div></div><script>const initial={{MESSAGES}};const box=document.getElementById('msgs');function add(role,text){const d=document.createElement('div');d.className='m '+(role==='user'?'u':'a');d.textContent=text;box.appendChild(d);box.scrollTop=box.scrollHeight;}if(initial.length) initial.forEach(m=>add(m.role,m.content));else add('assistant','Привет 😈 Я Лена AI — твой куратор.\n\nНачинать мы будем не с блога и не с продаж. Сначала разберёмся в тебе: опыте, навыках, сильных сторонах и том, за что тебе потенциально могут платить.\n\nРасскажи: чем ты занималась раньше и что ты умеешь делать?');async function send(){const i=document.getElementById('input');const t=i.value.trim();if(!t)return;add('user',t);i.value='';const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})});const j=await r.json();add('assistant',j.answer||j.error||'Ошибка');}</script></body></html>
