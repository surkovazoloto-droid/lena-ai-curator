services:
  - type: web
    name: lena-ai-curator
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-6-luna
